[project]
name = "app-store-updates-to-sqlite"
version = "0.1.0"
description = "Poll current iOS App Store releases into a durable SQLite history"
readme = "README.md"
authors = [
    { name = "Harold Martin", email = "harold.martin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app-store-updates-to-sqlite = "app_store_updates_to_sqlite:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lizard>=1.23.0",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
